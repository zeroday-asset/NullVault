name: Build Android APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: .signing/preview.keystore
          key: nullvault-preview3-debug-signing-v1
      - name: Prepare preview signing key
        run: |
          mkdir -p .signing
          if [ ! -f .signing/preview.keystore ]; then
            keytool -genkeypair -keystore .signing/preview.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=NullVault Preview" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NullVault-0.2.1-preview
          path: app/build/outputs/apk/debug/app-debug.apk
